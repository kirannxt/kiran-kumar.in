<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem;
      width: 100%;
      max-width: 900px;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.1);
      border: 1px solid rgba(167, 139, 250, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 1.5rem;
      white-space: nowrap;
    }

    /* No background-clip — just solid colors, zero clipping risk */
    h1 .word1 { color: #c4b5fd; }
    h1 .word2 { color: #60a5fa; }

    p {
      font-size: 1.125rem;
      color: #9ca3af;
      max-width: 400px;
      margin: 0 auto 3rem;
      line-height: 1.6;
      font-weight: 400;
    }

    .dots {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #a78bfa;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; background: #818cf8; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #60a5fa; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50%       { transform: scale(1.4); opacity: 1; }
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Under Construction</div>
    <h1><span class="word1">Coming</span> <span class="word2">Soon</span></h1>
    <p>Something amazing is on its way. Stay tuned - we'll be launching shortly.</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
